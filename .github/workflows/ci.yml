name: Customer Churn API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall ml

      - name: Build Docker image
        run: |
          docker build \
            -t customer-churn-api:${{ github.sha }} \
            -t customer-churn-api:latest \
            .

      - name: Verify Docker image
        run: |
          docker images customer-churn-api